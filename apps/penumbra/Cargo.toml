[package]
name = "penumbra"
description = "penumbra app: editor and outputs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
penumbra-engine.workspace = true
penumbra-gpu.workspace = true
penumbra-graph.workspace = true
penumbra-ops.workspace = true
penumbra-output.workspace = true
penumbra-project.workspace = true
penumbra-ui.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
egui.workspace = true
eframe = { workspace = true, features = ["wgpu", "wayland", "x11", "accesskit", "default_fonts"] }
wgpu.workspace = true
# The event loop is the app's (output windows next to eframe's); keeps winit's default
# backends (Wayland via dlopen, X11) on Linux.
winit.workspace = true

[lints]
workspace = true
