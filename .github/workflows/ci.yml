# Build, lint and test on every push to main and every pull request, on Windows, Linux and macOS.
#
# Windows is the platform penumbra is developed and shown on, so its job must pass.
# Linux and macOS are new: their jobs report what breaks there but do not fail the run yet.
# Remove `continue-on-error` from a platform once its job passes.
#
# The runners have no GPU. The tests use a software adapter instead: WARP on Windows,
# lavapipe (Mesa) on Linux. Where none exists, the GPU tests skip themselves.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            experimental: false
          - os: ubuntu-latest
            experimental: true
          - os: macos-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # pyo3 (crates/script, crates/pyhost) builds against the stable Python ABI from 3.12 on.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python arrays
        run: python -m pip install numpy

      # ALSA for audio input (cpal), udev for HID devices, lavapipe as the software adapter.
      # NumPy for the system's Python, the one the script node loads on Linux.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            mesa-vulkan-drivers cmake libx11-dev libxrandr-dev libxcb1-dev python3-numpy

      # Ubuntu's loader races across devices: KhronosGroup/Vulkan-Loader#1863, fixed in 1.4.350.
      - name: Linux Vulkan loader
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          vulkan_source="$RUNNER_TEMP/vulkan-source"
          vulkan_build="$RUNNER_TEMP/vulkan-build"
          vulkan_prefix="$RUNNER_TEMP/vulkan-runtime"
          git clone --depth 1 --branch vulkan-sdk-1.4.350.0 https://github.com/KhronosGroup/Vulkan-Loader.git "$vulkan_source"
          cmake -S "$vulkan_source" -B "$vulkan_build" -DUPDATE_DEPS=ON -DBUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$vulkan_prefix" -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build "$vulkan_build" --parallel 2
          cmake --install "$vulkan_build"
          export LD_LIBRARY_PATH="$vulkan_prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          python3 -c 'import ctypes; v=ctypes.c_uint32(); assert ctypes.CDLL("libvulkan.so.1").vkEnumerateInstanceVersion(ctypes.byref(v)) == 0; assert v.value >= ((1<<22)|(4<<12)|350); print("Vulkan loader:", v.value>>22, (v.value>>12)&1023, v.value&4095)'

      - uses: Swatinem/rust-cache@v2

      - name: clippy
        run: cargo xtask clippy

      - name: test
        env:
          RUST_BACKTRACE: "1"
          RUST_TEST_NOCAPTURE: "1"
        run: cargo xtask test

      - name: layers
        if: runner.os == 'Windows'
        run: cargo xtask layers
