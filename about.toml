# cargo-about: the third-party notices that ship with a build (`cargo xtask notices`).
#
# `accepted` is also the order of preference: for a crate under "MIT OR Apache-2.0" the notices
# carry MIT. A dependency under a licence missing here fails `cargo xtask ci`; add it only after
# checking what it asks of a binary distribution.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unicode-3.0",
    "IJG",
    # Symphonia (audio in FilmCraft): MPL-2.0 asks that the notices say where its source is.
    "MPL-2.0",
    # Fonts: effectcraft-text's and egui's bundled faces.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Bitstream-Vera",
]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# penumbra's own crates (`publish = false`) are covered by its own licence, not listed as third party.
private = { ignore = true }

# effectcraft-text embeds three OFL fonts from its repository's `assets/fonts/`, which its
# manifest licence does not mention. The checksums tie this to the pinned revision: a raised pin
# with changed licence files fails until they are checked again.
[effectcraft-text.clarify]
license = "(MIT OR Apache-2.0) AND OFL-1.1"

[[effectcraft-text.clarify.files]]
path = "../../LICENSE-MIT"
license = "MIT"
checksum = "7b6db9a363688683feacdf9b528f059637f2e5d2edbacd8720fc9b26781c9abe"

[[effectcraft-text.clarify.files]]
path = "../../LICENSE-APACHE"
license = "Apache-2.0"
checksum = "0d542e0c8804e39aa7f37eb00da5a762149dc682d7829451287e11b938e94594"

[[effectcraft-text.clarify.files]]
path = "../../assets/fonts/OFL-Inter.txt"
license = "OFL-1.1"
checksum = "262481e844521b326f5ecd053e59b98c8b2da78c8ee1bdbb6e8174305e54935a"

[[effectcraft-text.clarify.files]]
path = "../../assets/fonts/OFL-JetBrainsMono.txt"
license = "OFL-1.1"
checksum = "a76abf002c49097d146e86740a3105a5d00450b1592e820a1109a8c5680cd697"

[[effectcraft-text.clarify.files]]
path = "../../assets/fonts/OFL-NotoSerif.txt"
