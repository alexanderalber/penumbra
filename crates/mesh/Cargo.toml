[package]
name = "penumbra-mesh"
description = "Meshes on the CPU: OBJ, STL, glTF and FBX readers with budgets, part ids, primitives. No GPU, no UI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
penumbra-core.workspace = true
fbx-reader.workspace = true
serde_json.workspace = true

[dev-dependencies]
