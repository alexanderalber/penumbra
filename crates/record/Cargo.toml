[package]
name = "penumbra-record"
description = "Movie and sound recording: H.264 (on the CPU or an NVIDIA card's NVENC) and ProRes encoding, sound as AAC or PCM, MP4/MOV and WAV writing on threads of their own, bounded queues that drop instead of blocking. No wgpu, no UI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
penumbra-core.workspace = true
# Decodes recordings to make loops of them.
penumbra-video.workspace = true
filmcraft-h264enc.workspace = true
filmcraft-prores.workspace = true
filmcraft-isobmff.workspace = true
# The sound of MP4 recordings (AAC-LC).
filmcraft-aac.workspace = true
rayon.workspace = true
log.workspace = true
serde.workspace = true

# The graphics card's H.264 encoder (NVENC): the driver's library is loaded at run time and
# opened on a Direct3D 11 device of its own (src/nvenc).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
# The status as the commands show it, in the tests.
serde_json.workspace = true

[lints]
workspace = true
