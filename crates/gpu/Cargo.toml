[package]
name = "penumbra-gpu"
description = "The wgpu device, textures, fullscreen shader passes, readback and image files. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
penumbra-core.workspace = true
penumbra-mesh.workspace = true
wgpu.workspace = true
naga.workspace = true
half.workspace = true
bytemuck.workspace = true
photocraft-codecs.workspace = true
photocraft-psd.workspace = true
log.workspace = true
serde_json.workspace = true

# The memory DXGI grants the process (budget and usage), read through wgpu's DX12 adapter.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Dxgi"] }

[lints]
workspace = true
