<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>penumbra controls</title>
<style>
  :root { --chan: rgb(110, 210, 120); --text: #dcdcdc; --weak: #8c8c8c; --face: #3a3a3a; --well: #1e1e1e; --edge: #5a5a5a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #141414; color: var(--text); font: 16px system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 24px max(12px, env(safe-area-inset-left)); }
  header { display: flex; align-items: baseline; gap: 10px; margin: 0 0 14px; font-size: 14px; color: var(--weak); }
  header b { color: var(--text); font-weight: 600; }
  #link::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: #c55; }
  #link.ok::before { background: var(--chan); }
  #note { min-height: 1.3em; font-size: 14px; color: rgb(240, 180, 60); margin: -6px 0 10px; }
  #controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; max-width: 900px; }
  .cell { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .cell.wide { grid-column: 1 / -1; }
  .caption { font-size: 14px; color: var(--weak); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line { font: 13px ui-monospace, Consolas, monospace; color: var(--text); text-align: center; }
  .face { position: relative; height: 64px; border-radius: 6px; border: 1px solid var(--edge); background: var(--face);
    display: flex; align-items: center; justify-content: center; font-size: 17px; touch-action: none; cursor: pointer; overflow: hidden; }
  .button.lit { background: var(--chan); color: #0f0f0f; }
  .button.down { transform: translateY(2px); border-color: var(--text); }
  .slider { background: var(--well); height: 56px; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(110, 210, 120, 0.75); }
  .grip { position: absolute; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--text); }
  .slider.down .grip { background: #fff; }
  .off { opacity: 0.45; cursor: default; }
  .off .fill { background: rgba(110, 210, 120, 0.4); }
  .why { font-size: 12px; color: var(--weak); }
  #empty { color: var(--weak); max-width: 34em; line-height: 1.45; }
  code { color: var(--text); }
</style>
</head>
<body>
<header><b>penumbra</b><span id="link">connecting</span><span id="count"></span></header>
<div id="note"></div>
<div id="controls"></div>
<p id="empty" hidden>No control is flagged <code>show</code> yet. Set <code>show</code> on a
<code>chan.slider</code> or <code>chan.button</code> in the editor, and it appears here and on the show screen.</p>
<script>
"use strict";
// The built-in control page of chan.http_in. It draws the controls flagged `show` from the
// state the WebSocket sends ({controls: [...], params}), sets a slider's or toggle's value by
// its address ({"/fader/value": 0.5}) and holds momentary buttons with {"press": {"/go": true}}.
// A held press is renewed every RENEW ms; the server lets go of one not renewed for a second,
// and of all of them when the socket closes. This page lets go when the finger lifts, when the
// page is hidden and when the socket closes.
const RENEW = 250;
let socket = null;
let retry = 500;
let params = "controls";
let shape = "";
let controls = [];
const cells = new Map();   // path -> {c, el, face, line, why}
const held = new Set();    // paths of momentary buttons this page holds
const dragging = new Map(); // path -> pointerId of a slider being dragged
let pending = {};
let noteTimer = 0;

function $(id) { return document.getElementById(id); }

function connect() {
  socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  socket.onopen = () => { retry = 500; link(true); };
  socket.onclose = () => {
    socket = null;
    held.clear();
    dragging.clear();
    link(false);
    redrawAll();
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 5000);
  };
  socket.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.error) { note(m.error); return; }
    receive(m);
  };
}

function link(ok) {
  $("link").className = ok ? "ok" : "";
  $("link").textContent = ok ? "connected" : "not connected, trying again";
}

function note(text) {
  $("note").textContent = text;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { $("note").textContent = ""; }, 5000);
}

function send(obj) {
  if (socket && socket.readyState === 1) socket.send(JSON.stringify(obj));
}

// Slider values go out at most once per animation frame, the latest per address.
function sendValue(address, v) {
  const first = Object.keys(pending).length === 0;
  pending[address] = v;
  if (first) requestAnimationFrame(() => { const p = pending; pending = {}; send(p); });
}

function press(path, down) {
  if (down) held.add(path); else held.delete(path);
  send({ press: { [path]: down } });
  redraw(path);
}

function releaseAll() {
  if (held.size === 0) return;
  const p = {};
  for (const path of held) p[path] = false;
  held.clear();
  send({ press: p });
  redrawAll();
}

setInterval(() => {
  if (held.size === 0) return;
  const p = {};
  for (const path of held) p[path] = true;
  send({ press: p });
}, RENEW);

// Hidden, switched away or locked: let go, so no button stays held.
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });
window.addEventListener("pagehide", releaseAll);
window.addEventListener("blur", releaseAll);
document.addEventListener("contextmenu", (e) => e.preventDefault());

function disabledWhy(c) {
  if (params === "off") return "read only: params is off";
  if (c.locked) return "the node is locked";
  if (c.bound) return "follows a channel";
  return "";
}

function receive(m) {
  params = m.params || "controls";
  controls = Array.isArray(m.controls) ? m.controls : [];
  const s = JSON.stringify(controls.map((c) => [c.path, c.kind, c.mode, c.label, c.bound, c.locked, c.min, c.max])) + params;
  if (s !== shape) { shape = s; build(); }
  for (const c of controls) {
    const x = cells.get(c.path);
    if (!x) continue;
    // A slider under a finger keeps the finger's value; the server's may be a frame behind.
    if (dragging.has(c.path)) c.value = x.c.value;
    x.c = c;
  }
  redrawAll();
}

function build() {
  const box = $("controls");
  box.textContent = "";
  cells.clear();
  $("empty").hidden = controls.length > 0;
  $("count").textContent = controls.length === 1 ? "1 control" : controls.length + " controls";
  for (const c of controls) {
    const cell = document.createElement("div");
    cell.className = "cell";
    const caption = document.createElement("div");
    caption.className = "caption";
    const line = document.createElement("div");
    line.className = "line";
    const face = document.createElement("div");
    const why = document.createElement("div");
    why.className = "why";
    if (c.kind === "chan.slider") {
      cell.classList.add("wide");
      caption.textContent = c.label;
      face.className = "face slider";
      const fill = document.createElement("div");
      fill.className = "fill";
      const grip = document.createElement("div");
      grip.className = "grip";
      face.append(fill, grip);
      sliderEvents(face, c.path);
      cell.append(caption, line, face, why);
    } else {
      caption.textContent = c.label;
      face.className = "face button";
      face.textContent = c.label;
      buttonEvents(face, c.path);
      cell.append(line, face, why);
    }
    box.append(cell);
    cells.set(c.path, { c, el: cell, face, line, why });
  }
}

function usable(path) {
  const x = cells.get(path);
  return x && socket && !disabledWhy(x.c);
}

function buttonEvents(face, path) {
  face.addEventListener("pointerdown", (e) => {
    if (!usable(path)) return;
    e.preventDefault();
    face.setPointerCapture(e.pointerId);
    const x = cells.get(path);
    if (x.c.mode === "toggle") {
      sendValue(x.c.address, x.c.value >= 0.5 ? 0 : 1);
      face.classList.add("down");
    } else {
      press(path, true);
    }
  });
  const up = () => {
    face.classList.remove("down");
    if (held.has(path)) press(path, false);
  };
  face.addEventListener("pointerup", up);
  face.addEventListener("pointercancel", up);
  face.addEventListener("lostpointercapture", up);
}

function sliderEvents(face, path) {
  const set = (e) => {
    const x = cells.get(path);
    if (!x) return;
    const r = face.getBoundingClientRect();
    const t = Math.min(1, Math.max(0, (e.clientX - r.left) / Math.max(1, r.width)));
    const v = x.c.min + (x.c.max - x.c.min) * t;
    x.c.value = v;
    sendValue(x.c.address, v);
    redraw(path);
  };
  face.addEventListener("pointerdown", (e) => {
    if (!usable(path) || dragging.has(path)) return;
    e.preventDefault();
    face.setPointerCapture(e.pointerId);
    dragging.set(path, e.pointerId);
    set(e);
  });
  face.addEventListener("pointermove", (e) => { if (dragging.get(path) === e.pointerId) set(e); });
  const end = (e) => {
    if (dragging.get(path) !== e.pointerId) return;
    dragging.delete(path);
    redraw(path);
  };
  face.addEventListener("pointerup", end);
  face.addEventListener("pointercancel", end);
  face.addEventListener("lostpointercapture", end);
}

function fmt(v) {
  const a = Math.abs(v);
  return a >= 100 ? v.toFixed(1) : a >= 10 ? v.toFixed(2) : v.toFixed(3);
}

function redrawAll() { for (const path of cells.keys()) redraw(path); }

function redraw(path) {
  const x = cells.get(path);
  if (!x) return;
  const c = x.c;
  const why = socket ? disabledWhy(c) : "not connected";
  x.face.classList.toggle("off", !!why);
  x.why.textContent = why;
  if (c.kind === "chan.slider") {
    const span = c.max - c.min;
    const t = span !== 0 ? Math.min(1, Math.max(0, (c.value - c.min) / span)) : 0;
    x.face.firstChild.style.width = (t * 100) + "%";
    x.face.lastChild.style.left = "clamp(2px, " + (t * 100) + "%, calc(100% - 2px))";
    x.face.classList.toggle("down", dragging.has(path));
    x.line.textContent = fmt(c.value);
  } else {
    const mine = held.has(path);
    const lit = c.value >= 0.5 || mine;
    x.face.classList.toggle("lit", lit);
    if (c.mode !== "toggle") x.face.classList.toggle("down", mine);
    x.line.textContent = c.mode === "toggle" ? (lit ? "on" : "off") : (lit ? "held" : "momentary");
  }
}

connect();
</script>
</body>
</html>
