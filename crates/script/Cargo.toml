[package]
name = "penumbra-script"
description = "The script node's Python host: finds a Python, loads pyhost at runtime, runs scripts on its own thread under a watchdog. No GPU, no UI, no link to Python."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
penumbra-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
libloading.workspace = true
# Never referred to in code, so never linked: only here so that building anything that uses
# scripts also builds pyhost.dll (see crates/pyhost/Cargo.toml).
penumbra-pyhost.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[lints]
workspace = true
